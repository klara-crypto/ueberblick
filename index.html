<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klaras Überblick</title>
<meta name="theme-color" content="#E7EDEF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Überblick">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Italianno&family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Layout: ruhige Platinum-Seite, Dark Cyan als Bühne, Rosewood nur für die eine Aktion. Haarlinien, Pill-Formen, weiche Ecken, keine Schatten und Verläufe (Brand Kit K. Rose Retreats). */
:root{
  --bg:#E7EDEF; --surface:#F6F9FA; --ink:#031111; --muted:#3E5659; --line:#B3C4C8; --soft:#D3DFE2;
  --deep:#1C8C8C; --accent:#BA324F; --on-deep:#E7EDEF; --late:#BA324F; --ok:#1C8C8C;
  --c-mcp:#1C8C8C; --c-corinna:#C4852A; --c-biz:#C21F3A; --c-content:#7C5BB5; --c-reisen:#3A6EB5; --c-geld:#4A8F5C; --c-privat:#E0709A; --c-inbox:#7F9A9F;
  --font:'Be Vietnam Pro','Helvetica Neue',Arial,sans-serif; --serif:'Playfair Display',Georgia,serif; --script:'Italianno','Snell Roundhand',cursive;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#031111; --surface:#0B2222; --ink:#E7EDEF; --muted:#9DB4B8; --line:#24494B; --soft:#123030;
    --deep:#4DB8B8; --accent:#E0708A; --on-deep:#031111; --late:#F0869C; --ok:#4DB8B8;
    --c-mcp:#4DB8B8; --c-corinna:#E5B05A; --c-biz:#F0647C; --c-content:#B79BEA; --c-reisen:#7DAEEA; --c-geld:#7FCB93; --c-privat:#F4A0BC; --c-inbox:#8FAAB0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#031111; --surface:#0B2222; --ink:#E7EDEF; --muted:#9DB4B8; --line:#24494B; --soft:#123030;
  --deep:#4DB8B8; --accent:#E0708A; --on-deep:#031111; --late:#F0869C; --ok:#4DB8B8;
  --c-mcp:#4DB8B8; --c-corinna:#E5B05A; --c-biz:#F0647C; --c-content:#B79BEA; --c-reisen:#7DAEEA; --c-geld:#7FCB93; --c-privat:#F4A0BC; --c-inbox:#8FAAB0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:300 16px/1.5 var(--font);-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 200px}
header{padding:24px 0 4px}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font:600 38px/1.05 var(--serif);text-transform:uppercase;letter-spacing:.02em;color:var(--ink);margin:6px 0 8px;text-wrap:balance}
.where{margin:0;color:var(--muted);font-size:15px}
.where b{color:var(--ink);font-weight:500}
h2{font:500 12px/1.2 var(--font);letter-spacing:.2em;text-transform:uppercase;color:var(--ink);margin:28px 0 12px;display:flex;align-items:center;gap:12px}
h2::before,h2::after{content:"";flex:1;height:1px;background:var(--line)}
h2 small{font:500 12px var(--font);letter-spacing:0;color:var(--muted);border:1px solid var(--line);padding:1px 9px;border-radius:999px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:stretch;gap:2px;background:color-mix(in srgb,var(--c) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));border-radius:22px;padding:3px;border-left:9px solid var(--c)}
.row.late{border-color:var(--late);border-left-width:6px}
.chk{flex:none;width:48px;border:0;background:none;display:flex;align-items:center;justify-content:center}
.chk i{width:26px;height:26px;border-radius:50%;border:2px solid var(--c,var(--muted));display:block;position:relative;transition:transform .15s}
.chk:hover i{background:color-mix(in srgb,var(--c,var(--muted)) 25%,transparent);transform:scale(1.1)}
.row.fading{opacity:.4;transition:opacity 1.8s ease}
.row.fading .chk i{background:var(--c);animation:pop .35s}
.row.fading .chk i::after{content:"";position:absolute;left:7px;top:2px;width:6px;height:12px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.row.fading .ttl{text-decoration:line-through;color:var(--muted)}
.row.done{opacity:.72}
.row.doing{border-color:var(--c);box-shadow:none;background:color-mix(in srgb,var(--c) 24%,var(--surface))}
.pill-doing{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 11px;border-radius:999px;background:var(--c);color:var(--bg)}
.row.done .chk i{background:var(--c);animation:pop .35s}
.row.done .chk i::after{content:"";position:absolute;left:7px;top:2px;width:6px;height:12px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.row.done .ttl{text-decoration:line-through;color:var(--muted)}
.badge{flex:none;width:52px;margin:3px;border-radius:16px;background:color-mix(in srgb,var(--c) 20%,var(--surface));display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;line-height:1;color:var(--muted);text-transform:uppercase;font-weight:500;letter-spacing:.1em;padding:4px 0}
.badge b{font:400 30px/.9 var(--script);color:var(--ink);letter-spacing:0}
.body{flex:1;min-width:0;text-align:left;border:0;background:none;padding:10px 8px 10px 2px;border-radius:14px;display:flex;flex-direction:column;gap:4px}
.ttl{font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:2px 10px;border-radius:999px;color:var(--ink);background:color-mix(in srgb,var(--c) 38%,var(--surface))}
.due.late{color:var(--late);font-weight:500}
.due.today{color:var(--accent);font-weight:500}
.side{flex:none;display:flex;align-items:center;padding-right:8px}
.mini{border:1px solid var(--ink);background:none;color:var(--ink);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.mini:hover{background:var(--ink);color:var(--bg)}
.empty{padding:20px;color:var(--muted);border-radius:22px;border:1px solid var(--line);background:var(--surface);text-align:center}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 0;padding:12px 16px;border-radius:22px;border:1px solid var(--accent);background:var(--surface);font-size:14px;font-weight:400}
.banner button{border:0;background:var(--accent);color:#E7EDEF;font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-size:12px;border-radius:999px;padding:7px 16px}
.note{font-size:13px;color:var(--muted);margin:10px 2px 0}
/* Kacheln */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{text-align:left;border:1px solid var(--line);background:color-mix(in srgb,var(--c) 30%,var(--surface));border-radius:26px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:0;transition:transform .15s}
.tile:hover{transform:scale(1.02)}
.tile .em{font-size:26px;line-height:1.1}
.tile .n{font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
.tile .big{font:400 58px/.95 var(--script);color:var(--ink);font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:13px}
.back{border:1px solid var(--ink);background:none;border-radius:999px;color:var(--ink);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:6px 16px;margin-top:10px}
.cathead{display:flex;align-items:center;gap:10px;margin:16px 0 4px}
.cathead b{font:600 28px/1.1 var(--serif);text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
.sum{font-size:14px;color:var(--muted);margin:0 0 10px}
details{margin-top:14px}
summary{cursor:pointer;color:var(--muted);font-weight:500;padding:4px 0}
/* Reisen */
.card{background:color-mix(in srgb,var(--c-reisen) 18%,var(--surface));border:1px solid var(--line);border-radius:26px;padding:16px}
.card.plain{background:var(--surface)}
.card .nowname{font:600 28px/1.1 var(--serif);text-transform:uppercase;letter-spacing:.02em}
.stay{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:11px 6px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.stay:hover{background:var(--soft)}
.nowcard{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.stay:last-child{border-bottom:0}
.stay .f{font-size:24px;text-align:center}
.stay small{display:block;color:var(--muted);font-size:13px}
.stay .in{font-size:12px;font-weight:500;color:var(--ink);border:1px solid var(--line);padding:2px 10px;border-radius:999px}
a{color:var(--ink);font-weight:500;text-underline-offset:3px}
/* Eingabe */
.files{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.file{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 12px}
.file .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;background:none;border:0;text-align:left;color:var(--ink);font-weight:400;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.file small{color:var(--muted);font-size:12px;flex:none}
.file .x{flex:none;background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:0 4px;cursor:pointer}
.rev{border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:6px 0 12px;background:color-mix(in srgb,var(--c-content) 14%,var(--surface))}
.rev b{display:block;font-weight:500;margin-bottom:4px}
.rev p{margin:4px 0 8px;font-size:14px;color:var(--muted)}
.pill-rev{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 10px;border-radius:999px;background:var(--c-content);color:var(--bg)}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:20;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font:300 34px/1 var(--font);display:flex;align-items:center;justify-content:center;padding:0 0 4px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;pointer-events:none}
.dock>*{pointer-events:auto}
.dock .in{max-width:640px;margin:0 auto;padding:10px 14px 0;background:var(--bg)}
.modes{display:flex;gap:6px;margin-bottom:6px}
.mode{border:1px solid var(--ink);background:none;border-radius:999px;padding:3px 14px;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.mode[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:var(--on-deep)}
.compose{display:flex;gap:8px}
.compose input{flex:1;min-width:0;border:1px solid var(--ink);background:var(--surface);border-radius:999px;padding:11px 18px;font-size:16px;font-weight:300}
.compose input:focus{border-color:var(--deep);outline:2px solid var(--deep);outline-offset:0}
.compose button{flex:none;width:50px;border:0;background:var(--accent);color:#E7EDEF;border-radius:50%;font-weight:400;font-size:22px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);max-width:640px;margin:0 auto;padding:6px 10px 8px;background:var(--bg);pointer-events:auto}
.tabs button{border:0;background:none;padding:6px 2px;font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:0;position:relative}
.tabs .ic{font-size:20px;line-height:1.3}
.tabs button[aria-selected="true"]{color:var(--on-deep);background:var(--deep)}
.tabs .cnt{position:absolute;top:0;right:16%;font-size:11px;font-weight:500;letter-spacing:0;background:var(--accent);color:#E7EDEF;border-radius:999px;padding:0 6px;min-width:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:160px;background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:14px;font-weight:500;z-index:30;max-width:92%;display:none}
.toast.on{display:block}
/* Bearbeiten */
.scrim{position:fixed;inset:0;background:rgba(3,17,17,.55);display:none;align-items:flex-end;justify-content:center;z-index:40}
.scrim.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:22px 18px 26px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:28px}}
.sheet h3{font:600 24px/1.1 var(--serif);text-transform:uppercase;letter-spacing:.03em;margin:0 0 16px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field textarea{resize:vertical;line-height:1.5}
.field select,.field input,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 12px;width:100%;font-size:16px;font-weight:300}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--ink);background:none;border-radius:999px;padding:10px 22px;font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.btn.primary{background:var(--deep);border-color:var(--deep);color:var(--on-deep)}
.btn.danger{color:var(--late);border-color:var(--late);margin-left:auto}
.check{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:400}
.check input{width:22px;height:22px;accent-color:var(--deep)}
.bar{display:block;height:6px;background:color-mix(in srgb,var(--c) 25%,var(--surface));border-radius:999px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--c);border-radius:999px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.mnav b{font:600 22px/1 var(--serif);text-transform:uppercase;letter-spacing:.03em}
.mnav button{border:1px solid var(--ink);background:none;border-radius:999px;width:40px;height:34px;font-size:18px}
.segs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum3 div{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:10px 12px}
.sum3 span{display:block;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sum3 b{display:block;font:400 34px/1 var(--script);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sum3 small{font-size:12px;color:var(--muted)}
.mb{display:grid;grid-template-columns:86px 1fr;gap:6px 10px;align-items:center;margin:14px 0 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.mb i{display:block;height:12px;border-radius:999px;min-width:3px}
.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:10px 14px}
.mrow .d{flex:none;width:46px;font-size:12px;color:var(--muted);line-height:1.2}
.mrow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-weight:500;overflow-wrap:anywhere}
.mrow .a{flex:none;font-weight:500;font-variant-numeric:tabular-nums}
.mrow .a.in{color:color-mix(in srgb,var(--deep) 60%,var(--ink))}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow small{display:block;color:var(--muted);font-size:12px}
.prow .v{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.auth{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
.auth.on{display:flex}
.auth form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.auth h1{margin:0 0 4px}
.auth .msg{min-height:20px;font-size:14px;color:var(--late)}
.auth .msg.ok{color:var(--muted)}
.auth input{color:var(--ink);-webkit-text-fill-color:var(--ink);background:var(--surface);border:1px solid var(--muted);min-height:48px}
.auth input::placeholder{color:var(--muted);-webkit-text-fill-color:var(--muted);opacity:.8}
.foot{margin:34px 0 0;display:flex;flex-wrap:wrap;gap:8px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="date"></div>
    <h1 id="h1">Dein Tag</h1>
    <p class="where" id="where"></p>
  </header>
  <div id="sync" class="note" hidden></div>
  <main id="view"></main>
  <div class="foot"><button class="btn" type="button" id="btnExport">Daten sichern</button><button class="btn" type="button" id="btnImport">Daten einspielen</button><button class="btn" type="button" id="btnOut">Abmelden</button><input type="file" id="jsonIn" accept="application/json,.json" hidden></div>
</div>

<div class="dock">
  <div class="in">
  <nav class="tabs" id="tabs" role="tablist" aria-label="Ansichten">
    <button role="tab" type="button" data-tab="today" aria-selected="true"><span class="ic">🌤️</span>Heute</button>
    <button role="tab" type="button" data-tab="all" aria-selected="false"><span class="ic">🗂️</span>Projekte</button>
    <button role="tab" type="button" data-tab="ideas" aria-selected="false"><span class="ic">💡</span>Ideen<span class="cnt" id="inboxCnt" hidden></span></button>
    <button role="tab" type="button" data-tab="trip" aria-selected="false"><span class="ic">✈️</span>Reisen</button>
  </nav>
</div>
<input type="file" id="csv" accept=".csv,.txt,text/csv,text/plain" hidden>
<div class="auth" id="auth"><form id="authForm" autocomplete="on">
  <div class="eyebrow">Klaras Überblick</div><h1>Anmelden</h1>
  <div class="field"><label for="a-mail">E-Mail</label><input id="a-mail" type="email" autocomplete="email" placeholder="deine@mail.de" required></div>
  <div class="field"><label for="a-pw">Passwort</label><input id="a-pw" type="password" autocomplete="current-password" placeholder="mindestens 8 Zeichen" minlength="8" required></div>
  <div class="msg" id="a-msg" role="alert"></div>
  <button class="btn primary" type="submit" id="a-in">Anmelden</button>
  <button class="btn" type="button" id="a-up">Konto erstellen</button>
</form></div>
<button class="fab" type="button" data-act="new" aria-label="Neu anlegen">+</button>
<div class="toast" id="toast" role="status"></div>
<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="shTitle"><div class="sheet" id="sheet"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* Speicher-Adapter: gleiche Schnittstelle wie in Claude, aber mit Supabase (Anmeldung + eigene Daten) */
(function(){
  var C=window.APP_CONFIG||{},sb=null,uid=null,pend=0,pulls={},openGate;
  var gate=new Promise(function(r){openGate=r});
  function $(i){return document.getElementById(i)}
  function msg(t,ok){var m=$('a-msg');m.textContent=t||'';m.className='msg'+(ok?' ok':'')}
  function chk(r){if(r&&r.error)throw r.error}
  function pull(name){return pulls[name]&&pulls[name]()}
  var adapter={collection:function(name){return {
    doc:function(id){return {
      set:function(data){pend++;return sb.from('items').upsert({user_id:uid,coll:name,id:id,data:data,updated_at:new Date().toISOString()}).then(function(r){pend--;chk(r);pull(name)},function(e){pend--;throw e})},
      delete:function(){pend++;return sb.from('items').delete().eq('coll',name).eq('id',id).then(function(r){pend--;chk(r);pull(name)},function(e){pend--;throw e})}
    }},
    onSnapshot:function(next,err){
      var stop=false;
      function run(){
        if(pend>0)return;
        sb.from('items').select('id,data').eq('coll',name).then(function(r){
          if(stop||pend>0)return;
          if(r.error){if(err)err({code:'unavailable'});return}
          next({docs:r.data.map(function(x){return {id:x.id,data:function(){return x.data}}}),metadata:{fromCache:false}});
        });
      }
      pulls[name]=run;run();

function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

function occ(t){var d=t.due;if(!d)return '';if(t.repeat&&t.repeat!=='none'){var g=0;while(d<TD&&g<400){d=bump(d,t.repeat);g++}}return d}
function rel(d){
  var n=diff(TD,d);
  if(n===0)return 'heute';if(n===1)return 'morgen';if(n===2)return 'übermorgen';

  var x=parse(d);return WD[x.getDay()]+', '+x.getDate()+'. '+MON[x.getMonth()]+(x.getFullYear()!==new Date().getFullYear()?' '+x.getFullYear():'');
}

/* Datum aus Freitext holen */
function parseWhen(s){
  var m,due='',t=s,wk={montag:1,dienstag:2,mittwoch:3,donnerstag:4,freitag:5,samstag:6,sonntag:0};
  m=t.match(/(?:(?:^|\s)(?:am|bis|zum|ab)\s+)?(\d{1,2})\.\s?(\d{1,2})\.(\d{4}|\d{2})?(?!\d)/i);
  if(m){
    var y=m[3]?(m[3].length===2?2000+(+m[3]):+m[3]):new Date().getFullYear(),dd=+m[1],mm=+m[2];
    if(dd>=1&&dd<=31&&mm>=1&&mm<=12){
      var c=y+'-'+pad(mm)+'-'+pad(dd);
      if(!m[3]&&c<TD)c=(y+1)+'-'+pad(mm)+'-'+pad(dd);
      due=c;t=t.replace(m[0],' ');
    }
  }
  if(!due){m=t.match(/(^|\s)(übermorgen|uebermorgen|morgen|heute)(?=\s|$|[.,!?])/i);
    if(m){var w=m[2].toLowerCase();due=addDays(TD,w==='heute'?0:w==='morgen'?1:2);t=t.replace(m[0],' ')}}
  if(!due){m=t.match(/(^|\s)(?:am |bis |nächsten? )?(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)(?=\s|$|[.,!?])/i);
    if(m){var want=wk[m[2].toLowerCase()],cur=new Date().getDay(),add=(want-cur+7)%7;if(add===0)add=7;due=addDays(TD,add);t=t.replace(m[0],' ')}}
  if(!due){m=t.match(/(^|\s)in (\d+) (tagen|wochen)(?=\s|$|[.,!?])/i);
    if(m){due=addDays(TD,(+m[2])*(m[3].toLowerCase()==='wochen'?7:1));t=t.replace(m[0],' ')}}
  t=t.replace(/\s+/g,' ').replace(/^[\s,.\-–]+|[\s,.\-–]+$/g,'');
  return {due:due,title:t||s.trim()};
}

function viewIdeas(){
  var all=list().filter(function(t){return !t.done});
  var inb=all.filter(function(t){return t.cat==='inbox'}),ideas=all.filter(function(t){return t.kind==='idea'&&t.cat!=='inbox'});
  var h='';
  if(inb.length){
    h+='<h2>📥 Unsortiert<small>'+inb.length+'</small></h2><div class="list">'+inb.map(function(t){return rowHTML(t,{promote:t.kind==='idea'})}).join('')+'</div>';
    h+='<p class="note">Tippe einen Eintrag an und wähle den Bereich.</p>';
  }
  CATS.forEach(function(c){
    var a=ideas.filter(function(t){return t.cat===c.id});
    if(a.length)h+=section(c.e+' '+c.n,a,{hideCat:true,promote:true});
  });
  if(!inb.length&&!ideas.length)h+='<div class="empty" style="margin-top:18px">Die Ideenkiste ist noch leer 💭<br>Wähle unten „Idee“ und tippe los. Den Bereich erkenne ich selbst.</div>';
  return h;
}
function fd(x){return parse(x).getDate()+'. '+MON[parse(x).getMonth()]}
function stayTasks(sid){return list().filter(function(t){var x=stayOf(t);return x&&x.id===sid&&t.kind!=='idea'})}

function saveStays(){
  STAYS.sort(function(a,b){return a.s<b.s?-1:a.s>b.s?1:0});
  render();
  if(store){store.collection('meta').doc('stays').set({list:STAYS.map(function(x){return {id:x.id,n:x.n,f:x.f,s:x.s,e:x.e}})}).catch(function(){toast('Speichern hat nicht geklappt. Bitte noch einmal versuchen.')})}
}

function saveStay(id){
  var n=document.getElementById('st-name').value.trim(),f=document.getElementById('st-flag').value.trim()||'📍',
      a=document.getElementById('st-s').value,b=document.getElementById('st-e').value;
  if(!n){toast('Bitte einen Ort eintragen.');return}
  if(!a||!b){toast('Bitte Ankunft und Abreise eintragen.');return}
  if(b<a){toast('Die Abreise liegt vor der Ankunft.');return}
  if(id){var st=stayById(id);if(st){st.n=n;st.f=f;st.s=a;st.e=b}}
  else{id='st'+uid();STAYS.push({id:id,n:n,f:f,s:a,e:b})}
  closeSheet();saveStays();
}
function deleteStay(id){
  var i;for(i=0;i<STAYS.length;i++){if(STAYS[i].id===id){STAYS.splice(i,1);break}}
  if(stationSel===id)stationSel=null;
  Object.keys(items).forEach(function(k){if(items[k].stay===id){var n=Object.assign({},items[k]);n.stay='';put(k,n)}});
  closeSheet();saveStays();
}
function viewStation(){
  var st=stayById(stationSel),n=diff(st.s,st.e),all=stayTasks(st.id),open=all.filter(function(t){return !t.done}).sort(sortFn),done=all.filter(function(t){return t.done});
  var when=st.s<=TD&&TD<=st.e?'Tag '+Math.min(diff(st.s,TD)+1,Math.max(n,1))+' von '+Math.max(n,1):(st.s>TD?'in '+diff(TD,st.s)+' Tagen':'vorbei');
  var h='<div class="two" style="align-items:center"><button class="back" type="button" data-act="stback">‹ Unterwegs</button><button class="btn" type="button" data-act="stedit" data-id="'+st.id+'" style="justify-self:end">Station bearbeiten</button></div>';
  h+='<div class="card" style="margin-top:12px"><div class="nowname">'+st.f+' '+esc(st.n)+'</div><p class="sum" style="margin:6px 0 0">'+fd(st.s)+' bis '+fd(st.e)+(n>0?' · '+n+' Nächte':'')+' · '+when+'</p></div>';
  h+=open.length?'<h2>Aufgaben hier<small>'+open.length+'</small></h2><div class="list">'+open.map(function(t){return rowHTML(t,{hideCat:t.cat==='reisen'})}).join('')+'</div>':'<h2>Aufgaben hier</h2><div class="empty">Hier ist nichts offen.</div>';
  if(done.length)h+='<details><summary>Erledigt ('+done.length+')</summary><div class="list" style="margin-top:8px">'+done.map(function(t){return rowHTML(t,{hideCat:t.cat==='reisen'})}).join('')+'</div></details>';
  h+='<p class="note">Was du unten eintippst, wird dieser Station zugeordnet. Flüge und Hotels siehst du im <a href="'+PLANNER_URL+'">Reiseplaner</a>.</p>';
  return h;
}
function viewTrip(){
  if(stationSel&&stayById(stationSel))return viewStation();
  var cur=curStay(),nx=nextStays(),all=list();
  var h='<h2>📍 Wo ich gerade bin</h2>';
  if(cur){var tot=Math.max(diff(cur.s,cur.e),1),oc=stayTasks(cur.id).filter(function(t){return !t.done}).length;
    h+='<button class="card nowcard" type="button" data-act="station" data-id="'+cur.id+'"><div class="nowname">'+cur.f+' '+esc(cur.n)+'</div><p class="sum" style="margin:6px 0 0">Tag '+Math.min(diff(cur.s,TD)+1,tot)+' von '+tot+', bis '+fd(cur.e)+' · '+oc+' offen · antippen für alle Aufgaben</p></button>'}
  else h+='<div class="card"><div class="nowname">Unterwegs</div><p class="sum" style="margin:4px 0 0">Heute ist keine Station eingetragen.</p></div>';
  h+='<h2>🧳 Nächste Stationen</h2><div class="card plain" style="padding:4px 12px">';
  nx.forEach(function(s){
    var n=diff(TD,s.s),nights=diff(s.s,s.e),oc=stayTasks(s.id).filter(function(t){return !t.done}).length;
    h+='<button class="stay" type="button" data-act="station" data-id="'+s.id+'"><span class="f">'+s.f+'</span><span><b>'+esc(s.n)+'</b><small>'+fd(s.s)+' bis '+fd(s.e)+(nights>0?' · '+nights+' Nächte':'')+(oc?' · '+oc+' offen':'')+'</small></span><span class="in">in '+n+' Tagen</span></button>';
  });
  if(!nx.length)h+='<p class="sum" style="margin:10px 0">Keine weiteren Stationen eingetragen.</p>';
  h+='</div><button class="btn" type="button" data-act="stadd" style="margin-top:10px">+ Station hinzufügen</button><p class="note">Tippe auf eine Station, um ihre Aufgaben zu sehen. Flüge, Hotels und Kosten findest du im <a href="'+PLANNER_URL+'">Reiseplaner</a>.</p>';
  var loose=all.filter(function(t){return t.cat==='reisen'&&!t.done&&t.kind!=='idea'&&!stayOf(t)}).sort(sortFn);
  h+=section('🎫 Ohne Station',loose,{hideCat:true});

}
function render(){
  var hr=new Date().getHours(),gr=hr<11?'Guten Morgen ☀️':hr<18?'Hallo 🌸':'Guten Abend 🌙';document.getElementById('date').textContent=gr+', Klara · '+WDL[new Date().getDay()]+', '+new Date().getDate()+'. '+MONL[new Date().getMonth()];
  var cur=curStay(),titles={today:'Dein Tag',all:'Deine Projekte',ideas:'Ideenkiste',trip:'Unterwegs',money:'Geld'};
  document.getElementById('h1').textContent=titles[tab];
  document.getElementById('where').innerHTML=cur?cur.f+' <b>'+esc(cur.n)+'</b>, Tag '+(Math.min(diff(cur.s,TD)+1,Math.max(diff(cur.s,cur.e),1)))+' von '+Math.max(diff(cur.s,cur.e),1):'';
  var v={today:viewToday,all:viewAll,ideas:viewIdeas,trip:viewTrip,money:viewMoney}[tab]();

}

var pending={};
function softDone(id){
  var el=document.querySelector('.chk[data-id="'+id+'"]'),row=el&&el.closest('.row');
  if(pending[id]){clearTimeout(pending[id]);delete pending[id];if(row)row.classList.remove('fading');toast('Rückgängig',1200);return}
  if(row)row.classList.add('fading');
  pending[id]=setTimeout(function(){delete pending[id];toggleDone(id)},2000);
}
function toggleDone(id){
  var t=items[id];if(!t)return;var n=Object.assign({},t);
  if(!t.done&&t.repeat&&t.repeat!=='none'&&t.due){n.due=bump(t.due,t.repeat);toast('Nächstes Mal: '+rel(n.due))}
  else{n.done=!t.done;if(n.done){n.doneAt=new Date().toISOString();var cheers=['Geschafft! 🎉','Stark! ✨','Eins weniger 🌟','Check! 💪','Yay! 🥳'];toast(cheers[Math.floor(Math.random()*cheers.length)],1800)}}
  put(id,n);
}
function addEntry(raw){
  var w=parseWhen(raw),title=w.title,cat=classify(raw);
  var kind=mode,low=raw.toLowerCase();
  if(mode==='task'&&/^(idee|💡)/i.test(raw.trim())){kind='idea';title=title.replace(/^(idee|💡)\s*[:\-–]?\s*/i,'')||title}
  var o=mk({title:title,cat:cat,kind:kind,due:w.due,src:'app'});
  if(kind==='date'&&/geburtstag/.test(low)){o.repeat='yearly';o.cat=cat==='inbox'?'privat':cat}
  if(tab==='trip'&&stationSel){o.stay=stationSel;if(o.cat==='inbox')o.cat='reisen'}
  var id=uid();put(id,o);
  var msg='In „'+CAT[o.cat].n+'“'+(o.due?' · '+rel(o.due):'');
  if(kind==='date'&&!o.due){msg='Termin gespeichert. Bitte noch ein Datum eintragen.';setTimeout(function(){openSheet(id)},300)}
  toast(msg,3200);
}
async function sortWithClaude(){
  var inb=list().filter(function(t){return t.cat==='inbox'&&!t.done});
  if(!inb.length)return;
  var sample=null;try{sample=await claude.use('sample')}catch(e){}
  if(!sample){toast('Claude ist hier gerade nicht erreichbar.');return}
  var cats=CATS.filter(function(c){return c.id!=='inbox'}).map(function(c){return c.id+' = '+c.d}).join('\n');
  var prompt='Ordne jede Notiz genau einem Bereich zu. Bereiche:\n'+cats+'\n\nNotizen als JSON-Liste mit id und title:\n'+JSON.stringify(inb.map(function(t){return {id:t.id,title:t.title}}))+'\n\nAntworte nur mit einem JSON-Objekt, das jede id auf eine Bereichs-Kennung abbildet, zum Beispiel {"t1":"privat"}. Wenn nichts passt, nimm "privat".';
  try{
    toast('Claude sortiert …',8000);
    var out=sample.json?await sample.json(prompt):JSON.parse((await sample(prompt)).text);
    var n=0;
    inb.forEach(function(t){var c=out&&out[t.id];if(c&&CAT[c]&&c!=='inbox'){var x=Object.assign({},items[t.id]);x.cat=c;put(t.id,x);n++}});
    toast(n+' Einträge sortiert.');
  }catch(e){toast('Das Sortieren hat nicht geklappt. Du kannst Bereiche auch von Hand wählen.',4000)}
}

   +'<div class="two"><div class="field"><label for="f-amt">Betrag in Euro</label><input id="f-amt" inputmode="decimal" value="'+(t.amount?String(t.amount).replace('.',','):'')+'"></div><div class="field"><label for="f-link">Link</label><input id="f-link" inputmode="url" placeholder="https://" value="'+esc(t.link||'')+'"></div></div>'
   +'</div></details>'
   +'<div class="acts"><button class="btn primary" type="button" data-act="save" data-id="'+id+'">Speichern</button><button class="btn" type="button" data-act="close">Abbrechen</button><button class="btn danger" type="button" data-act="del" data-id="'+id+'">Löschen</button></div>';

function fmtSize(n){n=+n||0;return n>=1048576?(n/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(n/1024))+' KB'}
function filesHTML(id,t){
  if(!store||!store.storage)return '';
  var f=t.files||[],h='<div class="field"><label>Dateien</label><div class="files">';
  f.forEach(function(x,i){h+='<div class="file"><button class="fn" type="button" data-act="fopen" data-id="'+id+'" data-i="'+i+'">'+esc(x.name)+'</button><small>'+fmtSize(x.size)+'</small><button class="x" type="button" data-act="fdel" data-id="'+id+'" data-i="'+i+'" aria-label="Datei entfernen">×</button></div>'});
  h+='</div><input type="file" id="f-up" multiple hidden><button class="btn" type="button" data-act="fup">+ Datei hochladen</button></div>';
  var r=t.review;
  if(r==='pending')h+='<div class="rev"><b>👀 Bei Ina zur Kontrolle</b><p>Wartet auf Rückmeldung.</p><button class="btn" type="button" data-act="rvreset" data-id="'+id+'">Zurückholen</button></div>';
  else if(r==='redo')h+='<div class="rev"><b>↩ Ina bittet um Überarbeitung</b>'+(t.reviewNote?'<p>'+esc(t.reviewNote)+'</p>':'')+'<button class="btn" type="button" data-act="rvsend" data-id="'+id+'">Nochmal zur Kontrolle</button></div>';
  else if(r==='ok')h+='<div class="rev"><b>✓ Von Ina abgelegt</b>'+(t.reviewNote?'<p>'+esc(t.reviewNote)+'</p>':'')+'</div>';
  else h+='<div class="rev"><b>Zur Kontrolle</b><p>Wenn du fertig bist, schick es an Ina.</p><button class="btn primary" type="button" data-act="rvsend" data-id="'+id+'">Zur Kontrolle an Ina schicken</button></div>';
  return h;
}
function setReview(id,v){var t=items[id];if(!t)return;var n=Object.assign({},t);n.review=v;if(v==='pending'){n.reviewAt=new Date().toISOString();n.reviewNote=''}else n.reviewNote='';put(id,n);openSheet(id)}
function uploadFiles(id,list){
  var t=items[id];if(!t||!list.length)return;
  var uidv=store.storage.uid(),done=0,fails=0,added=[];
  toast('Lädt hoch …',60000);
  var chainU=Promise.resolve();
  Array.prototype.forEach.call(list,function(file){
    chainU=chainU.then(function(){
      var safe=file.name.replace(/[^A-Za-z0-9._-]+/g,'_'),path=uidv+'/'+id+'/'+Date.now().toString(36)+'-'+safe;
      return store.storage.up(path,file).then(function(){added.push({path:path,name:file.name,size:file.size,type:file.type||''})},function(e){fails++;toast('Hochladen hat nicht geklappt: '+((e&&e.message)||'Fehler'),6000)});
    });
  });
  chainU.then(function(){
    if(added.length){var cur=items[id];if(cur){var n=Object.assign({},cur);n.files=(cur.files||[]).concat(added);put(id,n)}}
    if(!fails)toast(added.length+(added.length===1?' Datei':' Dateien')+' hochgeladen.',2500);
    openSheet(id);
  });
}
function closeSheet(){document.getElementById('scrim').classList.remove('on')}
function saveSheet(id){
  var t=items[id];if(!t)return;var n=Object.assign({},t);
  n.title=document.getElementById('f-title').value.trim()||t.title;
  n.cat=document.getElementById('f-cat').value;n.kind=document.getElementById('f-kind').value;
  n.due=document.getElementById('f-due').value;n.repeat=document.getElementById('f-rep').value;
  n.stay=document.getElementById('f-stay').value;
  n.after=Array.prototype.filter.call(document.getElementById('f-after').options,function(o){return o.selected}).map(function(o){return o.value});
  var a=parseFloat(document.getElementById('f-amt').value.replace(/\./g,'').replace(',','.'));n.amount=isNaN(a)?null:a;
  n.link=document.getElementById('f-link').value.trim();n.note=document.getElementById('f-note').value.trim();
  n.focus=document.getElementById('f-focus').checked;n.doing=document.getElementById('f-doing').checked;
  put(id,n);closeSheet();
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act],[data-tab],[data-mode]');if(!el)return;
  if(el.dataset.tab){tab=el.dataset.tab;if(tab!=='all')catSel=null;stationSel=null;render();window.scrollTo(0,0);return}
  var a=el.dataset.act,id=el.dataset.id;
  if(a==='done')softDone(id);
  else if(a==='edit')openSheet(id);
  else if(a==='cat'){catSel=id;render();window.scrollTo(0,0)}
  else if(a==='back'){catSel=null;render()}
  else if(a==='station'){stationSel=id;render();window.scrollTo(0,0)}
  else if(a==='stadd')openStay('');
  else if(a==='stedit')openStay(id);
  else if(a==='stsave')saveStay(id);
  else if(a==='stdel'){deleteStay(id);toast('Station gelöscht.')}
  else if(a==='stback'){stationSel=null;render();window.scrollTo(0,0)}
  else if(a==='promote'){var t=items[id];if(t){var n=Object.assign({},t);n.kind='task';put(id,n);toast('Jetzt als Aufgabe in „'+CAT[n.cat].n+'“')}}
  else if(a==='ai')sortWithClaude();
  else if(a==='save')saveSheet(id);
  else if(a==='new')openNew(id||'');
  else if(a==='fup')document.getElementById('f-up').click();
  else if(a==='fopen'){var tt=items[id],ff=tt&&tt.files&&tt.files[+el.dataset.i];if(ff)store.storage.url(ff.path).then(function(u){window.open(u,'_blank')},function(){toast('Die Datei lässt sich gerade nicht öffnen.')})}
  else if(a==='fdel'){var t2=items[id],f2=t2&&t2.files&&t2.files[+el.dataset.i];if(f2&&confirm('„'+f2.name+'“ wirklich entfernen?')){store.storage.rm(f2.path).catch(function(){});var n2=Object.assign({},t2);n2.files=t2.files.filter(function(_,k){return k!==+el.dataset.i});put(id,n2);openSheet(id)}}
  else if(a==='rvsend')setReview(id,'pending');
  else if(a==='rvreset')setReview(id,'');
  else if(a==='nsave')saveNew();
  else if(a==='nwhen'){document.getElementById('n-when').value=addDays(TD,+id)}
  else if(a==='qwhen'){qc.when=addDays(TD,+id);render()}
  else if(a==='qcreate'){
    var what=qc.what.trim();if(!what){toast('Bitte schreib zuerst, was zu tun ist.');return}
    var w=parseWhen(what),due=qc.when||w.due,cat=qc.proj||classify(what);
    put(uid(),mk({title:w.title,cat:cat,kind:'task',due:due,src:'app'}));
    toast('In „'+CAT[cat].n+'“'+(due?' · '+rel(due):''),3000);qc={what:'',proj:'',when:''};render();
  }
  else if(a==='madd')openMoney(null);
  else if(a==='medit')openMoney(id);
  else if(a==='msave')saveMoney(id||null);
  else if(a==='mdel'){closeSheet();mremove(id);toast('Gelöscht.')}
  else if(a==='mmonth'){moneyMonth=shiftMonth(moneyMonth,+id);render()}
  else if(a==='macct'){moneyAcct=id;render()}
  else if(a==='mimport')document.getElementById('csv').click();
  else if(a==='close')closeSheet();
  else if(a==='del'){closeSheet();remove(id);toast('Gelöscht.')}
});
document.getElementById('sheet').addEventListener('change',function(e){
  if(e.target.id==='f-up'){var sb2=document.querySelector('[data-act=save]');if(sb2&&e.target.files.length)uploadFiles(sb2.dataset.id,e.target.files);return}
  if(e.target.id!=='f-note')return;var b=document.querySelector('[data-act=save]');if(!b)return;var id=b.dataset.id,t=items[id];
  if(t){var n=Object.assign({},t);n.note=e.target.value.trim();put(id,n);toast('Notiz gespeichert',1200)}
});
document.getElementById('view').addEventListener('input',function(e){if(e.target.id==='q-what')qc.what=e.target.value});
document.getElementById('view').addEventListener('change',function(e){if(e.target.id==='q-proj')qc.proj=e.target.value;if(e.target.id==='q-when')qc.when=e.target.value});
document.getElementById('scrim').addEventListener('click',function(e){if(e.target===this)closeSheet()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
/* ---------- Geld ---------- */
var money={},moneyMonth=TD.slice(0,7),moneyAcct='all',LSM='klara-money-v1';
function mput(id,d){money[id]=d;render();
  if(store){var ref=store.collection('money').doc(id);chain['m'+id]=(chain['m'+id]||Promise.resolve()).then(function(){return ref.set(d)}).catch(function(){toast('Speichern hat nicht geklappt.')})}
  else{try{localStorage.setItem(LSM,JSON.stringify(money))}catch(e){}}}
function mremove(id){delete money[id];render();
  if(store){var ref=store.collection('money').doc(id);chain['m'+id]=(chain['m'+id]||Promise.resolve()).then(function(){return ref.delete()}).catch(function(){toast('Löschen hat nicht geklappt.')})}
  else{try{localStorage.setItem(LSM,JSON.stringify(money))}catch(e){}}}
function mlist(){return Object.keys(money).map(function(id){return Object.assign({id:id},money[id])})}
function parseNum(v){v=String(v==null?'':v).replace(/[^\d,.\-+]/g,'');if(!v)return NaN;if(v.indexOf(',')>=0)v=v.replace(/\./g,'').replace(',','.');return parseFloat(v)}
function shiftMonth(ym,n){var d=new Date(+ym.slice(0,4),+ym.slice(5,7)-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function sgn(n){return (n<0?'−':'+')+eur(Math.abs(n))}
function viewMoney(){
  var all=mlist().filter(function(x){return moneyAcct==='all'||x.acct===moneyAcct});
  var mm=all.filter(function(x){return x.date&&x.date.slice(0,7)===moneyMonth}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
  var inn=0,out=0,by={};
  mm.forEach(function(x){var v=+x.amount||0,k=x.proj||'';by[k]=by[k]||{i:0,o:0};if(x.type==='in'){inn+=v;by[k].i+=v}else{out+=v;by[k].o+=v}});
  var net=inn-out,mx=Math.max(inn,out,1),yr=moneyMonth.slice(0,4),yi=0,yo=0;
  all.forEach(function(x){if(x.date&&x.date.slice(0,4)===yr){if(x.type==='in')yi+=+x.amount||0;else yo+=+x.amount||0}});
  var y=+moneyMonth.slice(0,4),m=+moneyMonth.slice(5,7)-1;
  var h='<div class="mnav"><button type="button" data-act="mmonth" data-id="-1" aria-label="Vorheriger Monat">‹</button><b>'+MONL[m]+' '+y+'</b><button type="button" data-act="mmonth" data-id="1" aria-label="Nächster Monat">›</button></div>';
  h+='<div class="segs">'+[['all','Alles'],['business','Business'],['privat','Privat']].map(function(a){return '<button class="mode" type="button" data-act="macct" data-id="'+a[0]+'" aria-pressed="'+(moneyAcct===a[0])+'">'+a[1]+'</button>'}).join('')+'</div>';
  h+='<div class="sum3"><div><span>Einnahmen</span><b>'+eur(inn)+'</b></div><div><span>Ausgaben</span><b>'+eur(out)+'</b></div><div><span>Gewinn</span><b style="'+(net<0?'color:var(--late)':'')+'">'+sgn(net)+'</b></div></div>';
  h+='<div class="mb"><span>Einnahmen</span><i style="width:'+Math.round(inn/mx*100)+'%;background:var(--deep)"></i><span>Ausgaben</span><i style="width:'+Math.round(out/mx*100)+'%;background:var(--accent)"></i></div>';
  h+='<p class="note">'+yr+' bisher: '+eur(yi)+' eingenommen, '+eur(yo)+' ausgegeben, Gewinn '+sgn(yi-yo)+'.</p>';
  h+='<div class="acts" style="margin:14px 0 0"><button class="btn primary" type="button" data-act="madd">+ Buchung</button><button class="btn" type="button" data-act="mimport">CSV einlesen</button></div>';
  var keys=Object.keys(by).sort(function(a,b){return Math.abs(by[b].i-by[b].o)-Math.abs(by[a].i-by[a].o)});
  if(keys.length){h+='<h2>Nach Projekt</h2><div class="card plain" style="padding:4px 14px">'+keys.map(function(k){var c=CAT[k],v=by[k];return '<div class="prow"><span>'+(c?chipHTML(c):'<span class="chip" style="--c:var(--c-inbox)">Ohne Projekt</span>')+'<small>+'+eur(v.i)+' · −'+eur(v.o)+'</small></span><span class="v">'+sgn(v.i-v.o)+'</span></div>'}).join('')+'</div>'}
  h+='<h2>Buchungen<small>'+mm.length+'</small></h2>';
  if(mm.length)h+='<div class="list">'+mm.map(function(x){var c=CAT[x.proj];var d=parse(x.date);return '<button class="mrow" type="button" data-act="medit" data-id="'+x.id+'"><span class="d">'+d.getDate()+'. '+MON[d.getMonth()]+'</span><span class="t"><span>'+esc(x.label||'Buchung')+'</span>'+(c?'<span>'+chipHTML(c)+'</span>':'')+'</span><span class="a '+(x.type==='in'?'in':'')+'">'+(x.type==='in'?'+':'−')+eur(+x.amount||0)+'</span></button>'}).join('')+'</div>';
  else h+='<div class="empty">In diesem Monat gibt es noch keine Buchungen.<br>Tippe auf „+ Buchung“ oder lies den CSV-Export deiner Bank ein.</div>';
  h+='<p class="note">Den automatischen Abgleich mit deinem Geschäftskonto und Google Sheets gibt es noch nicht. Bis dahin kannst du den CSV-Export deiner Bank einlesen, doppelte Buchungen werden erkannt.</p>';
  return h;
}
function openMoney(id){
  var t=id?money[id]:{date:TD,type:'out',amount:'',label:'',proj:'',acct:moneyAcct==='privat'?'privat':'business'};if(!t)return;
  var po='<option value="">Ohne Projekt</option>'+CATS.filter(function(c){return c.id!=='inbox'}).map(function(c){return '<option value="'+c.id+'"'+(t.proj===c.id?' selected':'')+'>'+c.e+' '+esc(c.n)+'</option>'}).join('');
  document.getElementById('sheet').innerHTML='<h3 id="shTitle">'+(id?'Buchung bearbeiten':'Neue Buchung')+'</h3>'
   +'<div class="two"><div class="field"><label for="m-type">Art</label><select id="m-type"><option value="out"'+(t.type==='out'?' selected':'')+'>Ausgabe</option><option value="in"'+(t.type==='in'?' selected':'')+'>Einnahme</option></select></div><div class="field"><label for="m-amt">Betrag in Euro</label><input id="m-amt" inputmode="decimal" value="'+(t.amount?String(t.amount).replace('.',','):'')+'"></div></div>'
   +'<div class="field"><label for="m-label">Wofür oder von wem</label><input id="m-label" value="'+esc(t.label||'')+'"></div>'
   +'<div class="two"><div class="field"><label for="m-date">Datum</label><input id="m-date" type="date" value="'+esc(t.date)+'"></div><div class="field"><label for="m-acct">Konto</label><select id="m-acct"><option value="business"'+(t.acct==='business'?' selected':'')+'>Business</option><option value="privat"'+(t.acct==='privat'?' selected':'')+'>Privat</option></select></div></div>'
   +'<div class="field"><label for="m-proj">Projekt</label><select id="m-proj">'+po+'</select></div>'
   +'<div class="acts"><button class="btn primary" type="button" data-act="msave" data-id="'+(id||'')+'">Speichern</button><button class="btn" type="button" data-act="close">Abbrechen</button>'+(id?'<button class="btn danger" type="button" data-act="mdel" data-id="'+id+'">Löschen</button>':'')+'</div>';
  document.getElementById('scrim').classList.add('on');
}
function saveMoney(id){
  var a=parseNum(document.getElementById('m-amt').value);
  if(isNaN(a)||a<=0){toast('Bitte einen Betrag über 0 eintragen.');return}
  var date=document.getElementById('m-date').value||TD;
  var d={date:date,type:document.getElementById('m-type').value,amount:Math.abs(a),label:document.getElementById('m-label').value.trim(),proj:document.getElementById('m-proj').value,acct:document.getElementById('m-acct').value};
  if(!d.proj&&d.label){var c=classify(d.label);if(c!=='inbox')d.proj=c}
  mput(id||'m'+uid(),d);moneyMonth=date.slice(0,7);closeSheet();render();
}
function splitCsv(line,d){var out=[],cur='',q=false;for(var i=0;i<line.length;i++){var c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===d&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}
function toIso(v){v=(v||'').trim();var m=v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);if(m){var y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+pad(+m[2])+'-'+pad(+m[1])}m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:''}
function importCsv(text){
  var lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(function(l){return l.trim()});
  if(lines.length<2){toast('Die Datei ist leer.');return}
  var d=lines[0].split(';').length>lines[0].split(',').length?';':',';
  var head=splitCsv(lines[0],d).map(function(x){return x.toLowerCase()}),di=-1,ai=-1,li=[];
  head.forEach(function(h,i){if(di<0&&/datum|date|buchungstag|valuta/.test(h))di=i;else if(ai<0&&/betrag|amount|umsatz/.test(h))ai=i;else if(/verwendung|beschreibung|zweck|text|empf|name|payee|description/.test(h))li.push(i)});
  if(di<0||ai<0){toast('Ich finde keine Spalten für Datum und Betrag. Die erste Zeile braucht Überschriften wie „Datum“ und „Betrag“.',6000);return}
  var acct=moneyAcct==='privat'?'privat':'business',fresh=[];
  lines.slice(1,501).forEach(function(l){
    var c=splitCsv(l,d),date=toIso(c[di]),amt=parseNum(c[ai]);if(!date||isNaN(amt)||amt===0)return;
    var label=li.map(function(i){return (c[i]||'').trim()}).filter(Boolean).join(' · ').slice(0,120)||'Buchung';
    var key=date+'|'+amt+'|'+label,hs=0;for(var i=0;i<key.length;i++){hs=(hs*31+key.charCodeAt(i))|0}
    var id='i'+Math.abs(hs).toString(36);if(money[id])return;
    var pj=classify(label);fresh.push([id,{date:date,type:amt>0?'in':'out',amount:Math.abs(amt),label:label,proj:pj==='inbox'?'':pj,acct:acct,src:'csv'}]);
  });
  if(!fresh.length){toast('Keine neuen Buchungen gefunden.');return}
  fresh.forEach(function(f){money[f[0]]=f[1]});
  var last=fresh.map(function(f){return f[1].date}).sort().pop();moneyMonth=last.slice(0,7);render();
  if(store){chain.import=(chain.import||Promise.resolve());fresh.forEach(function(f){var ref=store.collection('money').doc(f[0]);chain.import=chain.import.then(function(){return ref.set(f[1])})});chain.import=chain.import.catch(function(){toast('Nicht alle Buchungen konnten gespeichert werden.')})}
  else{try{localStorage.setItem(LSM,JSON.stringify(money))}catch(e){}}
  toast(fresh.length+' Buchungen eingelesen.',3000);
}
document.getElementById('csv').addEventListener('change',function(){var f=this.files&&this.files[0];if(!f)return;var inp=this;f.text().then(function(t){importCsv(t);inp.value=''}).catch(function(){toast('Die Datei konnte nicht gelesen werden.')})});
/* ---------- Start ---------- */
(async function(){
  var syncEl=document.getElementById('sync');
  var db=null;try{db=await claude.use('db')}catch(e){}
  if(!db){items=lsLoad();try{money=JSON.parse(localStorage.getItem(LSM)||'{}')||{}}catch(e){money={}}syncEl.hidden=false;syncEl.textContent='Gerade nur auf diesem Gerät gespeichert.';render();return}
  store=db;render();
  var timer=setTimeout(function(){syncEl.hidden=false;syncEl.textContent='Die Aufgaben werden noch geladen. Deine Änderungen werden später abgeglichen.'},10000);
  db.collection('tasks').onSnapshot(function(snap){
    var m={};snap.docs.forEach(function(d){m[d.id]=d.data()});
    items=m;
    if(!snap.metadata.fromCache){clearTimeout(timer);syncEl.hidden=true}
    render();
  },function(){clearTimeout(timer);syncEl.hidden=false;syncEl.textContent='Die Verbindung zum Speicher ist unterbrochen. Lade die Seite neu, wenn es so bleibt.'});
  db.collection('meta').onSnapshot(function(snap){snap.docs.forEach(function(d){if(d.id==='stays'){var l=(d.data()||{}).list||[];STAYS.length=0;l.forEach(function(x){STAYS.push(x)});render()}})},function(){});
  db.collection('money').onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=d.data()});money=m;render()},function(){});
})();
render();
</script>
